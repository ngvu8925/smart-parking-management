version: '3.8'

services:
  smart-water-guardian:
    build: .
    container_name: smart-water-guardian
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "1883:1883"
    environment:
      - SWG_SERVER_HOST=0.0.0.0
      - SWG_SERVER_PORT=8000
      - SWG_MQTT_HOST=127.0.0.1
      - SWG_MQTT_PORT=1883
    volumes:
      - ./data:/app/data
